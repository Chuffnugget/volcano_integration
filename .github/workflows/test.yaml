name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: "10"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.12"
            requirements: requirements-test-min.txt
          - python: "3.14"
            requirements: requirements-test.txt
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r "${{ matrix.requirements }}"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --timeout=30
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: volcano-integration-python-${{ matrix.python }}
          path: dist/volcano_integration.zip
          if-no-files-found: error
