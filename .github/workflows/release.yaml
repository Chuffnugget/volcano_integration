name: Package release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --timeout=30
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: "10"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Validate tag and build HACS ZIP
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/package_release.py --tag "$RELEASE_TAG"
      - name: Save tested ZIP
        uses: actions/upload-artifact@v7.0.2
        with:
          name: volcano-release
          path: dist/volcano_integration.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: volcano-release
          path: dist
      - name: Attach ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/volcano_integration.zip
